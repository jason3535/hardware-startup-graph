name = "jasons-hardware-notes"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Bind KV namespace — replace id after running:
#   wrangler kv:namespace create SUBSCRIBERS
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "REPLACE_WITH_KV_ID_AFTER_CREATE"

# Custom domain — uncomment after DNS is set up
# routes = [
#   { pattern = "insights.jasonlin.tech/*", custom_domain = true }
# ]

# Secrets (do NOT put values here — set with `wrangler secret put`):
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put SEND_SECRET
