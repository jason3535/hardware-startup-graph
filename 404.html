<title>页面不存在 · 智能硬件图谱</title>
<script>
// 常见走丢:人物页链接少了 .html、或大小写不对 → 归一后再试一次;仍 404 就落到本页(不会死循环)
(function(){var p=location.pathname,m=p.match(/^\/p\/([^\/.]+)(\.html)?\/?$/i);
if(m&&!location.search.match(/retry/)){var t='/p/'+m[1].toLowerCase()+'.html';if(t!==p)location.replace(t+'?retry=1');}})();
</script>

a.b{display:inline-block;padding:11px 20px;border-radius:999px;background:#0a84ff;color:#fff;text-decoration:none;font-weight:600;margin-right:10px;margin-bottom:10px}a.s{color:#0a84ff;text-decoration:none}</style>
